<div
  class="bg-gray-800/80 backdrop-blur-sm rounded-3xl p-8 border border-gray-700 transition-all duration-500 hover:transform hover:scale-105 group relative overflow-hidden h-full"
  [ngClass]="{
    'hover:border-blue-500': color === 'blue',
    'hover:border-cyan-500': color === 'cyan',
    'hover:border-emerald-500': color === 'green'
  }"
>
  <div
    class="absolute inset-0 bg-gradient-to-br opacity-0 group-hover:opacity-100 transition-opacity duration-500"
    [ngClass]="{
      'from-blue-500/5 to-cyan-500/5': color === 'blue',
      'from-cyan-500/5 to-emerald-500/5': color === 'cyan',
      'from-emerald-500/5 to-amber-500/5': color === 'green'
    }"
  ></div>

  <div class="flex items-center mb-6 relative z-10">
    <div
      class="w-14 h-14 bg-gradient-to-br rounded-2xl flex items-center justify-center mr-4 group-hover:scale-110 transition-transform duration-300 shadow-lg"
      [ngClass]="{
        'from-blue-500 to-cyan-500': color === 'blue',
        'from-cyan-500 to-emerald-500': color === 'cyan',
        'from-emerald-500 to-amber-500': color === 'green'
      }"
    >
      <i [class]="icon + ' text-white text-3xl'"></i>
    </div>
    <div>
      <h3 class="text-2xl font-bold text-white">{{ title }}</h3>
      <p
        class="text-sm"
        [ngClass]="{
          'text-cyan-400': color === 'blue',
          'text-emerald-400': color === 'cyan',
          'text-amber-400': color === 'green'
        }"
      >
        {{ description }}
      </p>
    </div>
  </div>
  <div class="flex flex-wrap gap-3 relative z-10">
    <span
      *ngFor="let item of items"
      class="px-4 py-3 bg-gray-900/80 text-gray-300 rounded-xl text-sm border border-gray-700 transition-all duration-300 hover:transform hover:scale-105 hover:shadow-lg hover:shadow-emerald-500/10 font-medium"
      [ngClass]="{
        'hover:border-blue-500 hover:text-blue-400 hover:bg-blue-500/10':
          color === 'blue',
        'hover:border-cyan-500 hover:text-cyan-400 hover:bg-cyan-500/10':
          color === 'cyan',
        'hover:border-emerald-500 hover:text-emerald-400 hover:bg-emerald-500/10':
          color === 'green'
      }"
    >
      {{ item }}
    </span>
  </div>

  <div class="mt-8 pt-6 border-t border-gray-700 relative z-10">
    <div class="flex items-center justify-between text-sm text-gray-400">
      <span>Always learning</span>
      <span>Latest tools</span>
    </div>
  </div>
</div>
