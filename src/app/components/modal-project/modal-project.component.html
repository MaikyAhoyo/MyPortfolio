<div
  class="fixed inset-0 z-50 transition-all duration-300"
  [class]="
    selectedProject
      ? 'opacity-100 visible'
      : 'opacity-0 invisible pointer-events-none'
  "
>
  <div
    class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity duration-300"
    [class]="selectedProject ? 'opacity-100' : 'opacity-0'"
    (click)="onClose()"
  ></div>

  <div
    class="absolute inset-0 overflow-hidden"
    (click)="$event.stopPropagation()"
  >
    <div
      class="h-full w-full md:w-3/4 lg:w-2/3 xl:w-1/2 md:ml-auto bg-gray-900/95 backdrop-blur-xl border-l border-gray-700/50 shadow-2xl transform transition-all duration-300 ease-out"
      [class]="
        selectedProject
          ? 'md:translate-x-0 translate-y-0'
          : 'md:translate-x-full translate-y-full'
      "
    >
      <div class="h-full flex flex-col">
        <div
          class="p-4 sm:p-6 border-b border-gray-700/50 bg-gradient-to-r from-gray-900 to-gray-800/80 flex justify-between items-center"
        >
          <div class="flex items-center gap-2 sm:gap-3">
            <div
              class="w-2 h-6 sm:w-3 sm:h-8 bg-gradient-to-b from-blue-500 to-cyan-500 rounded-full"
            ></div>
            <h3
              class="text-xl sm:text-2xl md:text-3xl font-bold text-white truncate max-w-[200px] sm:max-w-none"
            >
              {{ selectedProject?.title }}
            </h3>
          </div>
          <button
            class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg sm:rounded-xl bg-gray-800 hover:bg-gray-700 border border-gray-700/50 flex items-center justify-center text-xl sm:text-2xl text-gray-400 hover:text-white transition-all duration-300 hover:scale-110 group flex-shrink-0"
            (click)="onClose()"
          >
            <i
              class="ph ph-x group-hover:scale-110 transition-transform text-sm sm:text-base"
            ></i>
          </button>
        </div>

        <div class="flex-1 overflow-y-auto custom-scrollbar">
          <div class="p-4 sm:p-6">
            <div *ngIf="selectedProject?.images" class="mb-6 sm:mb-8">
              <div
                class="relative rounded-xl sm:rounded-2xl overflow-hidden group"
              >
                <img
                  [src]="selectedProject.images[0]"
                  class="w-full h-48 sm:h-64 md:h-80 object-cover transform group-hover:scale-105 transition-transform duration-700"
                  alt="{{ selectedProject.title }}"
                />
                <div
                  class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"
                ></div>
              </div>
              <div
                class="flex gap-2 sm:gap-3 mt-3 sm:mt-4 overflow-x-auto pb-2 custom-scrollbar"
              >
                <img
                  *ngFor="let img of selectedProject.images; let i = index"
                  [src]="img"
                  class="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 flex-shrink-0 object-cover rounded-lg sm:rounded-xl cursor-pointer border-2 transition-all duration-300 hover:scale-105"
                  [class]="
                    i === 0
                      ? 'border-blue-500'
                      : 'border-transparent hover:border-cyan-500'
                  "
                />
              </div>
            </div>

            <div class="mb-6 sm:mb-8">
              <div class="flex items-center gap-2 mb-3 sm:mb-4">
                <div
                  class="w-1 h-4 sm:h-6 bg-gradient-to-b from-blue-500 to-cyan-500 rounded-full"
                ></div>
                <h4 class="text-white font-semibold text-base sm:text-lg">
                  About the Project
                </h4>
              </div>
              <p
                class="text-gray-300 leading-relaxed text-sm sm:text-base md:text-lg"
              >
                {{ selectedProject?.description }}
              </p>
            </div>

            <div class="mb-6 sm:mb-8">
              <div class="flex items-center gap-2 mb-3 sm:mb-4">
                <div
                  class="w-1 h-4 sm:h-6 bg-gradient-to-b from-cyan-500 to-emerald-500 rounded-full"
                ></div>
                <h4 class="text-white font-semibold text-base sm:text-lg">
                  Technologies Used
                </h4>
              </div>
              <div class="flex flex-wrap gap-2 sm:gap-3">
                <span
                  *ngFor="let tech of selectedProject?.tech"
                  class="px-3 py-1 sm:px-4 sm:py-2 bg-gradient-to-r from-blue-500/20 to-cyan-500/20 text-blue-300 font-medium rounded-lg sm:rounded-xl border border-blue-500/30 hover:border-blue-400 hover:scale-105 transition-all duration-300 backdrop-blur-sm text-xs sm:text-sm"
                >
                  {{ tech }}
                </span>
              </div>
            </div>

            <div *ngIf="selectedProject?.features" class="mb-6 sm:mb-8">
              <div class="flex items-center gap-2 mb-3 sm:mb-4">
                <div
                  class="w-1 h-4 sm:h-6 bg-gradient-to-b from-emerald-500 to-amber-500 rounded-full"
                ></div>
                <h4 class="text-white font-semibold text-base sm:text-lg">
                  Key Features
                </h4>
              </div>
              <ul class="grid gap-2 sm:gap-3">
                <li
                  *ngFor="let feature of selectedProject.features"
                  class="flex items-start gap-2 sm:gap-3 p-3 sm:p-4 bg-gray-800/50 rounded-lg sm:rounded-xl border border-gray-700/50 hover:border-emerald-500/50 transition-all duration-300 group"
                >
                  <div
                    class="w-5 h-5 sm:w-6 sm:h-6 bg-emerald-500/20 rounded-md sm:rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5 group-hover:scale-110 transition-transform"
                  >
                    <i class="ph ph-check text-emerald-400 text-xs"></i>
                  </div>
                  <span
                    class="text-gray-300 group-hover:text-white transition-colors text-sm sm:text-base"
                    >{{ feature }}</span
                  >
                </li>
              </ul>
            </div>
          </div>
        </div>

        <div
          class="p-4 sm:p-6 border-t border-gray-700/50 bg-gradient-to-r from-gray-900 to-gray-800/80"
        >
          <div class="flex flex-row items-center justify-center gap-3 sm:gap-4">
            <app-button
              color="primary"
              function="redirect"
              text="Live Demo"
              icon="ph ph-arrow-square-out"
              link="selectedProject?.link"
            ></app-button>

            <app-button
              color="secondary"
              function="redirect"
              text="View Code"
              icon="ph ph-github-logo"
              link="selectedProject?.github"
            ></app-button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
