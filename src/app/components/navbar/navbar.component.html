<nav
  class="fixed top-0 w-full z-50 bg-gray-900/80 backdrop-blur-md border-b border-gray-800"
>
  <div class="container mx-auto px-6 py-4">
    <div class="flex justify-between items-center">
      <a
        href="#hero"
        class="text-xl font-bold text-white hover:text-blue-400 transition-colors"
      >
        Miguel Arroyo
      </a>
      <div class="hidden md:flex space-x-8">
        <a
          href="#about"
          class="text-gray-300 hover:text-white transition-colors"
          >About</a
        >
        <a
          href="#projects"
          class="text-gray-300 hover:text-white transition-colors"
          >Projects</a
        >
        <a
          href="#skills"
          class="text-gray-300 hover:text-white transition-colors"
          >Skills</a
        >
        <a
          href="#contact"
          class="text-gray-300 hover:text-white transition-colors"
          >Contact</a
        >
      </div>
      <button
        class="md:hidden text-white cursor-pointer"
        (click)="toggleMobileMenu()"
      >
        <i class="ph ph-list text-white text-2xl"></i>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div
    class="md:hidden fixed top-[60px] left-0 w-full h-[calc(100vh-4rem)] bg-gray-900/95 backdrop-blur-lg border-t border-gray-800 transform transition-transform duration-300 ease-in-out z-40"
    [class]="isMobileMenuOpen ? 'translate-x-0' : 'translate-x-full'"
  >
    <div class="container mx-auto px-6 py-8">
      <div class="flex flex-col space-y-8">
        <!-- Navigation Links -->
        <div class="flex flex-col space-y-6">
          <a
            href="#about"
            class="text-2xl font-bold text-white hover:text-blue-400 transition-colors py-3 border-b border-gray-800"
            (click)="closeMobileMenu()"
          >
            About
          </a>
          <a
            href="#projects"
            class="text-2xl font-bold text-white hover:text-blue-400 transition-colors py-3 border-b border-gray-800"
            (click)="closeMobileMenu()"
          >
            Projects
          </a>
          <a
            href="#skills"
            class="text-2xl font-bold text-white hover:text-blue-400 transition-colors py-3 border-b border-gray-800"
            (click)="closeMobileMenu()"
          >
            Skills
          </a>
          <a
            href="#contact"
            class="text-2xl font-bold text-white hover:text-blue-400 transition-colors py-3 border-b border-gray-800"
            (click)="closeMobileMenu()"
          >
            Contact
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Overlay -->
  <div
    class="md:hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-30 transition-opacity duration-300"
    [class]="isMobileMenuOpen ? 'opacity-100 visible' : 'opacity-0 invisible'"
    (click)="toggleMobileMenu()"
  ></div>
</nav>
