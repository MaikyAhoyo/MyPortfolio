<div
  class="group bg-gray-900 rounded-2xl p-6 hover:transform hover:scale-105 hover:shadow-2xl transition-all duration-300 cursor-pointer border border-gray-800 hover:border-blue-500 animate-fade-in-up"
  [style.animation-delay.ms]="100"
  (click)="onSelect()"
>
  <div class="relative overflow-hidden rounded-xl mb-4">
    <div
      class="w-full h-48 bg-gradient-to-br from-blue-600 to-cyan-600 rounded-xl group-hover:from-blue-500 group-hover:to-cyan-500 transition-all"
    ></div>
    <div
      class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center"
    >
      <span class="text-white font-bold text-lg">View Details</span>
    </div>
  </div>
  <h3
    class="text-xl font-bold text-white mb-2 group-hover:text-blue-400 transition-colors"
  >
    {{ project.title }}
  </h3>
  <p class="text-gray-400 mb-4 line-clamp-2">
    {{ project.description }}
  </p>
  <div class="flex flex-wrap gap-2 mb-4">
    <span
      *ngFor="let tech of project.tech"
      class="px-3 py-1 bg-gray-800 text-gray-300 text-sm rounded-full border border-gray-700"
    >
      {{ tech }}
    </span>
  </div>
  <div class="flex justify-between items-center">
    <span class="text-blue-400 font-bold hover:text-blue-300 transition-colors">
      View Project →
    </span>
  </div>
</div>
