<section
  id="hero"
  class="snap-start min-h-screen flex flex-col justify-center items-center text-center bg-gradient-to-br from-blue-900 via-cyan-900 to-gray-900 px-4 sm:px-8 md:px-12 lg:px-20 relative overflow-hidden"
>
  <div class="absolute inset-0 overflow-hidden">
    <div class="absolute -inset-10 opacity-25">
      <div
        class="absolute top-1/4 left-1/4 w-72 h-72 bg-cyan-500 rounded-full mix-blend-multiply filter blur-xl animate-float-slow"
        data-animation="fade-in"
      ></div>
      <div
        class="absolute top-1/3 right-1/4 w-72 h-72 bg-blue-500 rounded-full mix-blend-multiply filter blur-xl animate-float-medium delay-1000"
        data-animation="fade-in"
        data-delay="500"
      ></div>
      <div
        class="absolute bottom-1/4 left-1/2 w-72 h-72 bg-emerald-500 rounded-full mix-blend-multiply filter blur-xl animate-float-fast delay-2000"
        data-animation="fade-in"
        data-delay="1000"
      ></div>
    </div>
  </div>

  <div class="relative z-10 w-full max-w-6xl mx-auto px-4">
    <h1
      class="text-5xl sm:text-6xl md:text-7xl lg:text-8xl xl:text-9xl font-bold mb-4 text-white whitespace-nowrap"
      data-animation="fade-in-up"
    >
      Miguel
      <span
        class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400"
        >Arroyo</span
      >
    </h1>

    <p
      class="text-xl sm:text-2xl md:text-3xl lg:text-4xl mb-8 md:mb-10 text-gray-300 whitespace-nowrap"
      data-animation="fade-in-up"
      data-delay="200"
    >
      Frontend Developer
    </p>

    <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
      <app-button
        color="primary"
        function="redirect"
        text="View My Work"
        icon="ph ph-arrow-right"
        link="#projects"
      ></app-button>

      <app-button
        color="secondary"
        function="redirect"
        text="Get In Touch"
        icon="ph ph-user-plus"
        link="#contact"
      ></app-button>
    </div>
  </div>

  <div
    class="absolute bottom-4 left-1/2 transform -translate-x-1/2 animate-bounce md:block hidden"
    data-animation="fade-in"
    data-delay="800"
  >
    <div class="flex flex-col items-center gap-2">
      <span class="text-sm text-cyan-400 font-medium whitespace-nowrap"
        >Scroll Down</span
      >
      <div
        class="w-6 h-10 border-2 border-cyan-400 rounded-full flex justify-center"
      >
        <div class="w-1 h-3 bg-cyan-400 rounded-full mt-2 animate-pulse"></div>
      </div>
    </div>
  </div>

  <div
    class="absolute bottom-2 left-1/2 transform -translate-x-1/2 animate-bounce md:hidden"
    data-animation="fade-in"
    data-delay="800"
  >
    <div class="flex flex-col items-center gap-1">
      <span class="text-xs text-cyan-400 font-medium">Scroll</span>
      <div
        class="w-4 h-6 border border-cyan-400 rounded-full flex justify-center"
      >
        <div
          class="w-0.5 h-1.5 bg-cyan-400 rounded-full mt-1 animate-pulse"
        ></div>
      </div>
    </div>
  </div>
</section>
