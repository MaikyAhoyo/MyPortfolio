<section
  id="contact"
  class="snap-start min-h-screen py-12 sm:py-16 md:py-20 lg:py-24 px-4 sm:px-6 md:px-8 lg:px-20 bg-gray-800 flex flex-col justify-center items-center relative overflow-hidden"
>
  <div class="absolute inset-0 overflow-hidden opacity-10">
    <div
      class="absolute top-1/4 -right-10 sm:-right-16 md:-right-20 w-48 h-48 sm:w-64 sm:h-64 md:w-80 md:h-80 lg:w-96 lg:h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-xl sm:blur-2xl md:blur-3xl animate-float-slow"
    ></div>
    <div
      class="absolute bottom-1/4 -left-10 sm:-left-16 md:-left-20 w-48 h-48 sm:w-64 sm:h-64 md:w-80 md:h-80 lg:w-96 lg:h-96 bg-cyan-500 rounded-full mix-blend-multiply filter blur-xl sm:blur-2xl md:blur-3xl animate-float-medium delay-2000"
    ></div>
  </div>

  <div
    class="absolute inset-0 opacity-5 bg-[linear-gradient(#ffffff_1px,transparent_1px),linear-gradient(90deg,#ffffff_1px,transparent_1px)] bg-[size:40px_40px] sm:bg-[size:50px_50px] lg:bg-[size:60px_60px]"
  ></div>

  <div class="max-w-6xl mx-auto w-full relative z-10 px-4">
    <h2
      class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold text-center mb-12 sm:mb-16 md:mb-20 text-white"
      data-animation="fade-in-up"
    >
      Get In
      <span
        class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400"
        >Touch</span
      >
    </h2>

    <div class="grid lg:grid-cols-2 gap-8 sm:gap-12 md:gap-16">
      <div data-animation="fade-in-left">
        <div class="space-y-4 sm:space-y-6">
          <div
            class="flex items-center p-4 sm:p-5 md:p-6 bg-gray-900/80 backdrop-blur-sm rounded-xl sm:rounded-2xl border border-gray-700 hover:border-blue-500 transition-all duration-300 group cursor-pointer"
            (click)="copyToClipboard('arroyomiguel590@gmail.com')"
          >
            <div
              class="w-10 h-10 sm:w-12 sm:h-12 md:w-14 md:h-14 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-lg sm:rounded-xl md:rounded-2xl flex items-center justify-center mr-3 sm:mr-4 md:mr-5 group-hover:scale-110 transition-transform duration-300 shadow-lg flex-shrink-0"
            >
              <i class="ph ph-envelope text-white text-3xl"></i>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-white font-semibold text-base sm:text-lg">
                Email
              </h3>
              <p
                class="text-gray-400 group-hover:text-blue-400 transition-colors text-sm sm:text-base truncate"
              >
                arroyomiguel590&#64;gmail.com
              </p>
            </div>
            <div
              class="text-blue-400 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0 ml-2"
            >
              <i
                class="ph ph-copy text-gray-400 group-hover:text-blue-400 transition-colors"
              ></i>
            </div>
          </div>

          <div
            class="flex items-center p-4 sm:p-5 md:p-6 bg-gray-900/80 backdrop-blur-sm rounded-xl sm:rounded-2xl border border-gray-700 hover:border-cyan-500 transition-all duration-300 group cursor-pointer"
            (click)="copyToClipboard('+526311130239')"
          >
            <div
              class="w-10 h-10 sm:w-12 sm:h-12 md:w-14 md:h-14 bg-gradient-to-br from-cyan-500 to-emerald-500 rounded-lg sm:rounded-xl md:rounded-2xl flex items-center justify-center mr-3 sm:mr-4 md:mr-5 group-hover:scale-110 transition-transform duration-300 shadow-lg flex-shrink-0"
            >
              <i class="ph ph-phone text-white text-3xl"></i>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-white font-semibold text-base sm:text-lg">
                Phone
              </h3>
              <p
                class="text-gray-400 group-hover:text-cyan-400 transition-colors text-sm sm:text-base"
              >
                +52 (631) 113-0239
              </p>
            </div>
            <div
              class="text-cyan-400 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0 ml-2"
            >
              <i
                class="ph ph-copy text-gray-400 group-hover:text-cyan-400 transition-colors"
              ></i>
            </div>
          </div>

          <div
            class="flex items-center p-4 sm:p-5 md:p-6 bg-gray-900/80 backdrop-blur-sm rounded-xl sm:rounded-2xl border border-gray-700 hover:border-emerald-500 transition-all duration-300 group"
          >
            <div
              class="w-10 h-10 sm:w-12 sm:h-12 md:w-14 md:h-14 bg-gradient-to-br from-emerald-500 to-amber-500 rounded-lg sm:rounded-xl md:rounded-2xl flex items-center justify-center mr-3 sm:mr-4 md:mr-5 group-hover:scale-110 transition-transform duration-300 shadow-lg flex-shrink-0"
            >
              <i class="ph ph-map-pin-line text-white text-3xl"></i>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-white font-semibold text-base sm:text-lg">
                Location
              </h3>
              <p
                class="text-gray-400 group-hover:text-emerald-400 transition-colors text-sm sm:text-base"
              >
                Hermosillo, SON
              </p>
            </div>
          </div>

          <div class="pt-4 sm:pt-6">
            <h4
              class="text-white font-semibold mb-4 sm:mb-6 text-base sm:text-lg"
            >
              Follow Me
            </h4>
            <div class="flex space-x-3 sm:space-x-4">
              <a
                href="https://www.linkedin.com/in/miguel-angel-arroyo-lópez-ab322027b"
                target="_blank"
                rel="noopener noreferrer"
                class="w-10 h-10 sm:w-12 sm:h-12 md:w-14 md:h-14 bg-gray-900/80 rounded-lg sm:rounded-xl md:rounded-2xl flex items-center justify-center border border-gray-700 hover:border-blue-500 hover:bg-blue-500/10 transition-all transform hover:scale-110 group flex-shrink-0"
              >
                <i
                  class="ph ph-linkedin-logo text-2xl text-gray-700 group-hover:text-blue-400 transition-colors"
                ></i>
              </a>
              <a
                href="https://github.com/MaikyAhoyo"
                target="_blank"
                rel="noopener noreferrer"
                class="w-10 h-10 sm:w-12 sm:h-12 md:w-14 md:h-14 bg-gray-900/80 rounded-lg sm:rounded-xl md:rounded-2xl flex items-center justify-center border border-gray-700 hover:border-cyan-500 hover:bg-cyan-500/10 transition-all transform hover:scale-110 group flex-shrink-0"
              >
                <i
                  class="ph ph-github-logo text-2xl text-gray-700 group-hover:text-cyan-400 transition-colors"
                ></i>
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div data-animation="fade-in-right" data-delay="200">
        <div
          class="bg-gray-900/80 backdrop-blur-sm rounded-2xl sm:rounded-3xl p-4 sm:p-6 md:p-8 border border-gray-700"
        >
          <h3 class="text-xl sm:text-2xl font-bold text-white mb-4 sm:mb-6">
            Send Me a Message
          </h3>
          <form class="space-y-4 sm:space-y-6" (submit)="onSubmit($event)">
            <div class="grid sm:grid-cols-2 gap-4 sm:gap-6">
              <div>
                <label
                  class="text-gray-400 text-xs sm:text-sm font-medium mb-1 sm:mb-2 block"
                  >Your Name</label
                >
                <input
                  type="text"
                  placeholder="John Doe"
                  class="w-full p-3 sm:p-4 rounded-lg sm:rounded-xl bg-gray-800 border border-gray-700 focus:outline-none focus:border-blue-500 text-white placeholder-gray-500 transition-colors text-sm sm:text-base"
                  required
                />
              </div>
              <div>
                <label
                  class="text-gray-400 text-xs sm:text-sm font-medium mb-1 sm:mb-2 block"
                  >Your Email</label
                >
                <input
                  type="email"
                  placeholder="john@example.com"
                  class="w-full p-3 sm:p-4 rounded-lg sm:rounded-xl bg-gray-800 border border-gray-700 focus:outline-none focus:border-blue-500 text-white placeholder-gray-500 transition-colors text-sm sm:text-base"
                  required
                />
              </div>
            </div>
            <div>
              <label
                class="text-gray-400 text-xs sm:text-sm font-medium mb-1 sm:mb-2 block"
                >Subject</label
              >
              <input
                type="text"
                placeholder="Project Collaboration"
                class="w-full p-3 sm:p-4 rounded-lg sm:rounded-xl bg-gray-800 border border-gray-700 focus:outline-none focus:border-blue-500 text-white placeholder-gray-500 transition-colors text-sm sm:text-base"
                required
              />
            </div>
            <div>
              <label
                class="text-gray-400 text-xs sm:text-sm font-medium mb-1 sm:mb-2 block"
                >Your Message</label
              >
              <textarea
                placeholder="Hello Miguel, I'd like to discuss..."
                rows="4"
                class="w-full p-3 sm:p-4 rounded-lg sm:rounded-xl bg-gray-800 border border-gray-700 focus:outline-none focus:border-blue-500 text-white placeholder-gray-500 transition-colors resize-none text-sm sm:text-base"
                required
              ></textarea>
            </div>
            <button
              type="submit"
              class="w-full px-6 sm:px-8 py-3 sm:py-4 bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-bold rounded-lg sm:rounded-xl hover:from-blue-500 hover:to-cyan-500 transition-all transform hover:scale-105 shadow-2xl group flex items-center justify-center gap-2 sm:gap-3 text-sm sm:text-base"
            >
              <span>Send Message</span>
              <i class="ph ph-paper-plane-tilt text-white text-2xl"></i>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
