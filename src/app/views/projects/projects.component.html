<section
  id="projects"
  class="snap-start min-h-screen py-24 px-6 md:px-20 bg-gray-800 flex flex-col justify-center relative overflow-hidden"
>
  <div class="absolute inset-0 overflow-hidden opacity-10">
    <div
      class="absolute top-20 -left-40 w-80 h-80 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl"
    ></div>
    <div
      class="absolute bottom-20 -right-40 w-80 h-80 bg-cyan-500 rounded-full mix-blend-multiply filter blur-3xl"
    ></div>
    <div
      class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-emerald-500 rounded-full mix-blend-multiply filter blur-3xl"
    ></div>
  </div>

  <div
    class="absolute inset-0 opacity-5 bg-[linear-gradient(#ffffff_1px,transparent_1px),linear-gradient(90deg,#ffffff_1px,transparent_1px)] bg-[size:60px_60px]"
  ></div>

  <div class="container mx-auto relative z-10">
    <div class="text-center mb-20">
      <h2
        class="text-4xl sm:text-5xl md:text-6xl font-bold text-center mb-6 text-white"
      >
        My
        <span
          class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400"
          >Projects</span
        >
      </h2>
      <p class="text-xl text-gray-400 max-w-3xl mx-auto">
        A selection of my most recent and relevant work — focused on clean code,
        scalability, and seamless user experiences built with modern full-stack
        technologies.
      </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-8">
      <app-card
        [project]="{
          title: 'Chefcitos',
          description:
            'A recipe-sharing platform where users can publish, review, and rate recipes. Built with Angular, Express.js, and Supabase.',
          tech: ['Angular', 'TypeORM', 'Express.js', 'Supabase', 'Node.js'],
          images: ['/assets/chefcitos-1.jpg', '/assets/chefcitos-2.jpg'],
          features: [
            'Recipe Filters & Tags',
            'User Reviews & Ratings',
            'Responsive UI',
            'Modular Architecture'
          ],
          link: 'https://chefcitos.vercel.app',
          github: 'https://github.com/MaikyAhoyo/chefcitos'
        }"
        (selectedProject)="handleSelectedProject($event)"
      >
      </app-card>

      <app-card
        [project]="{
          title: 'Products Verifier',
          description:
            'A multilingual product validation app that verifies products by code and features theme toggling, timing controls, and flag-based UI.',
          tech: ['Angular', 'TypeScript', 'TailwindCSS', 'i18n'],
          images: ['/assets/verifier-1.jpg', '/assets/verifier-2.jpg'],
          features: [
            'Dark / Light Theme',
            'Language Switch (EN/ES)',
            'Product Code Validation',
            'Custom UI Components'
          ],
          link: 'https://products-verifier.vercel.app',
          github: 'https://github.com/MaikyAhoyo/products-verifier'
        }"
        (selectedProject)="handleSelectedProject($event)"
      >
      </app-card>

      <app-card
        [project]="{
          title: 'Django Recipes API',
          description:
            'Backend REST API developed with Django and Django REST Framework to manage recipes, users, and reviews with full CRUD support.',
          tech: ['Django', 'DRF', 'PostgreSQL', 'JWT Auth'],
          images: ['/assets/djangoapi-1.jpg', '/assets/djangoapi-2.jpg'],
          features: [
            'RESTful Endpoints',
            'Token Authentication',
            'Database Validation',
            'Admin Panel Integration'
          ],
          link: 'https://github.com/MaikyAhoyo/django-recipes-api',
          github: 'https://github.com/MaikyAhoyo/django-recipes-api'
        }"
        (selectedProject)="handleSelectedProject($event)"
      >
      </app-card>
    </div>
  </div>

  <app-modal-project
    [selectedProject]="selectedProject"
    (closeModal)="closeProject()"
  ></app-modal-project>
</section>
