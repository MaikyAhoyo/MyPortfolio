<section
  id="skills"
  class="snap-start min-h-screen py-24 px-6 md:px-20 bg-gray-900 flex flex-col justify-center items-center relative overflow-hidden"
>
  <div
    class="absolute inset-0 opacity-5 bg-[linear-gradient(#ffffff_1px,transparent_1px),linear-gradient(90deg,#ffffff_1px,transparent_1px)] bg-[size:60px_60px]"
  ></div>

  <div class="container mx-auto relative z-10">
    <h2
      class="text-4xl sm:text-5xl md:text-6xl font-bold text-center mb-20 text-white"
      data-animation="fade-in-up"
    >
      My
      <span
        class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400"
        >Skills</span
      >
    </h2>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-7xl mx-auto">
      <app-skills-card
        data-animation="fade-in-left"
        icon="ph ph-monitor"
        color="blue"
        title="Frontend"
        description="Modern UI development with clean, dynamic, and scalable design."
        [items]="[
          'Angular',
          'TypeScript',
          'JavaScript (ES6+)',
          'HTML5',
          'CSS3',
          'Tailwind CSS',
          'Responsive Design',
          'Component Architecture'
        ]"
      ></app-skills-card>

      <app-skills-card
        data-animation="fade-in-up"
        icon="ph ph-hard-drives"
        color="cyan"
        title="Backend"
        description="Building efficient APIs and database-driven systems."
        [items]="[
          'Node.js',
          'Express.js',
          'TypeORM',
          'Supabase',
          'PostgreSQL',
          'REST APIs',
          'Authentication & JWT',
          'Error Handling'
        ]"
      ></app-skills-card>

      <app-skills-card
        data-animation="fade-in-right"
        icon="ph ph-gear"
        color="green"
        title="Tools & Tech"
        description="Workflow, versioning, and quality assurance."
        [items]="[
          'Git & GitHub',
          'Docker',
          'Cypress',
          'Postman',
          'VS Code',
          'Figma',
          'Linux & CLI',
          'AWS (basics)'
        ]"
      ></app-skills-card>
    </div>
  </div>
</section>
